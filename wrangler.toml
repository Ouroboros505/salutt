# Cloudflare Pages configuration. Kept in the repo so the KV binding the sync
# endpoint depends on is not invisible dashboard state.
name = "salutt"
compatibility_date = "2025-04-01"
pages_build_output_dir = "dist"

# One encrypted blob per user, addressed by an id derived from their recovery
# code. The server holds no key; see functions/api/sync.ts.
[[kv_namespaces]]
binding = "SALUTT_KV"
id = "5d31d8a237ad4b2799fe0aee97c1353d"

# Stops new accounts being claimed. Claiming is the only way a stranger's
# request can cause a KV write, and KV writes are capped per day across the
# whole Cloudflare account — shared with everything else deployed on it.
#
# Declared here rather than in the dashboard because deploying with a
# wrangler.toml replaces the deployment config, silently discarding vars set
# through the UI. Unset temporarily to enrol a new recovery phrase.
[vars]
SALUTT_LOCK = "1"
